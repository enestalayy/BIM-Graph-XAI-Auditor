[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bim-graph-xai-auditor"
version = "0.1.0"
description = "Automated BIM compliance auditing using Neo4j Knowledge Graphs and Explainable AI"
authors = [{ name = "Enes Talay", email = "enes@example.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    # IFC Parsing
    "ifcopenshell>=0.7.0",
    # Graph Database
    "neo4j>=5.19.0",
    # Data Validation & Settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Geometry & Numerical
    "numpy>=1.26.0",
    "shapely>=2.0.0",
    # Logging
    "python-json-logger>=2.0.7",
    # CLI
    "click>=8.1.7",
    # Utilities
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
ai = [
    # LangChain Core
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    # Gemini Flash integration
    "langchain-google-genai>=1.0.0",
    # Neo4j LangChain integration
    "langchain-neo4j>=0.1.0",
    # Output parsing
    "langchain-text-splitters>=0.2.0",
]

ui = [
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pyvis>=0.3.2",
    "pandas>=2.2.0",
]

dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
bim-kg-pipeline = "src.graph.kg_pipeline:main"
bim-audit = "src.audit.audit_pipeline:main"
bim-report = "src.xai.report_generator:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---------------------------------------------------------------------------
# Ruff — Linter & Formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

# ---------------------------------------------------------------------------
# Mypy — Static Type Checker
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (require running Neo4j)",
    "slow: marks tests as slow",
]
addopts = "--tb=short -v"
